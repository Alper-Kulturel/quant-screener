name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The floor, not a preference: the report builder in screener.py uses
          # nested same-type quotes inside f-strings, which is a SyntaxError
          # before 3.12 (PEP 701). Running the suite here keeps that honest.
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Test
        run: python -m pytest tests/ -v
